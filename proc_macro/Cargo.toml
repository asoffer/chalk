[package]
name = "chalk-proc-macro"
description = "Macros for Chalk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
quote = "1.0.38"
syn = { version = "2.0.95", features = ["extra-traits", "full"] }
proc-macro2 = { version = "1.0.92", features = ["span-locations"] }
